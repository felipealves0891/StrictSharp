name: .NET CI/CD

on:
  push:
    branches:
      - feat/**

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: 'StrictSharp.sln'
  PROJECT: 'src/StrictSharp.Analyzers/StrictSharp.Analyzers.csproj'

jobs:
  ci:
    name: Build and Tests 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build
        run: |
          dotnet build "${{ env.SOLUTION }}" \
            --configuration Release \
            --no-restore \
            -p:Version=1.0.${{ github.run_number }} \
            -p:ContinuousIntegrationBuild=true

      - name: Unit Tests
        run: |
          dotnet test "${{ env.SOLUTION }}" \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
      
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Validate Coverage
        run: |
          echo "Current directory:"
          pwd

          echo "Files in .github:"
          ls -la .github/

          echo "Scripts:"
          ls -la .github/scripts/
          
          python .github/scripts/validate-coverage.py \
            --directory ./TestResults \
            --min-lines 90 \
            --min-branches 75
      
