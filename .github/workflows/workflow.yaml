name: .NET CI/CD

on:
  push:
    branches:
      - feat/**

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: 'StrictSharp.sln'
  PROJECT: 'src/StrictSharp.Analyzers/StrictSharp.Analyzers.csproj'

jobs:
  ci:
    name: Build and Tests 
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION }}"

      - name: Build
        run: |
          dotnet build "${{ env.SOLUTION }}" \
            --configuration Release \
            --no-restore \
            -p:Version=1.0.${{ github.run_number }} \
            -p:ContinuousIntegrationBuild=true

      - name: Unit Tests
        if: always()
        run: |
          dotnet test "${{ env.SOLUTION }}" \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
      
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Validate Coverage
        if: always()
        run: |
          echo "Current directory:"
          pwd

          echo "Files in .github:"
          ls -la .github/

          echo "Scripts:"
          ls -la .github/scripts/
          
          python .github/scripts/validate-coverage.py \
            --directory ./TestResults \
            --min-lines 90 \
            --min-branches 75
      
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        if: always() &&
            github.event_name == 'push'
        run: |
          SOURCE="${GITHUB_REF_NAME}"

          case "$SOURCE" in
            feat/*)
              TARGET="develop"
              ;;
            develop)
              TARGET="main"
              ;;
            *)
              echo "Branch não configurada: $SOURCE"
              exit 0
              ;;
          esac

          echo "Origem: $SOURCE"
          echo "Destino: $TARGET"

          # Verificar se já existe PR aberto
          PR=$(gh pr list \
            --base "$TARGET" \
            --head "$SOURCE" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$PR" ]; then
            echo "PR #$PR já existe."
            exit 0
          fi

          # Verificar se há diferenças entre branches
          git fetch origin "$TARGET"

          if git diff --quiet "origin/$TARGET...HEAD"; then
            echo "Nenhuma alteração para integrar."
            exit 0
          fi

          # Criar PR
          gh pr create \
            --base "$TARGET" \
            --head "$SOURCE" \
            --title "merge: $SOURCE into $TARGET" \
            --body "Pull Request criado automaticamente após aprovação do CI."
      